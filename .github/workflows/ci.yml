# GitHubへリポジトリをpushすると自動で走るチェック
# (ローカルでは scripts/run_checks.sh で同種の検証を実行。OS固有検査と対象範囲は異なる)
name: CI

permissions:
  contents: read

on:
  # PRブランチはpull_requestだけで検証し、同じコミットにpush用CIまで
  # 二重起動しない。マージ後のmainはpushで改めて確認する。
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
      - name: Install voice system dependency
        run: |
          sudo apt-get update
          sudo apt-get install --yes libopus0
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt -c requirements-lock.txt
          python -m pip check
      - name: Compile check
        run: git ls-files -z '*.py' | xargs -0 python -m py_compile
      - name: Unit tests
        # -t . が無いと tests/ 自身が top-level 扱いになり tests/__init__.py の
        # 本番DB隔離ガードが読み込まれない (unittest discover の仕様)。外さないこと。
        run: python -m unittest discover -s tests -t .
