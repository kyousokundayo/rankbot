# GitHubへリポジトリをpushすると自動で走るチェック
# (ローカルでは scripts/run_checks.sh が同等)
name: CI

permissions:
  contents: read

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Install voice system dependency
        run: |
          sudo apt-get update
          sudo apt-get install --yes libopus0
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt -c requirements-lock.txt
          python -m pip check
      - name: Compile check
        run: git ls-files -z '*.py' | xargs -0 python -m py_compile
      - name: Unit tests
        run: python -m unittest discover -s tests
      - name: Game simulation
        run: python simulate_games.py --runs 10
