# GitHubへリポジトリをpushすると自動で走るチェック
# 稼働環境と同じ macOS / Apple Silicon で検証する。
name: CI

permissions:
  contents: read

on:
  # PRブランチはpull_requestだけで検証し、同じコミットにpush用CIまで
  # 二重起動しない。マージ後のmainはpushで改めて確認する。
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
      - name: Verify macOS runtime
        run: |
          test "$(uname -s)" = "Darwin"
          test "$(uname -m)" = "arm64"
          python scripts/verify_runtime.py
      - name: Install voice system dependency
        run: |
          brew install opus
          OPUS_LIB="$(brew --prefix opus)/lib/libopus.dylib"
          file "$OPUS_LIB"
          file "$OPUS_LIB" | grep -q arm64
      - name: Build production-equivalent virtual environment
        run: |
          PYTHON_BIN="$(command -v python)" ./scripts/setup_venv.sh
      - name: Verify voice dependencies
        run: ./.venv/bin/python -c 'import sounds; sounds.require_voice_ready()'
      - name: Compile check
        run: git ls-files -z '*.py' | xargs -0 ./.venv/bin/python -m py_compile
      - name: Unit tests
        # -t . が無いと tests/ 自身が top-level 扱いになり tests/__init__.py の
        # 本番DB隔離ガードが読み込まれない (unittest discover の仕様)。外さないこと。
        run: ./.venv/bin/python -m unittest discover -s tests -t .
